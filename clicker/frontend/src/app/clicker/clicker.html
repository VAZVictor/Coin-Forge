<div class="clickerContainer" [class.shake]="isShaking()">
  <div class="statsPanel">
    <div class="coinCount numeric">
      <span class="coinValue">{{ coinsDisplay() }}</span>
      <span class="coinLabel">coins</span>
    </div>
    <div class="subStats">
      <span>{{ cpsDisplay() }} per second</span>
      <span>{{ clickPowerDisplay() }} per click</span>
    </div>
  </div>

  <div class="buttonStage">
    <div class="clickButtonWrap">
      @if (isVip) {
      <!-- VIP FACE BUTTON -->
      <button type="button" class="mainClickButton vipFaceButton" [@squish]="squishState()"
        (click)="onButtonClick($event)" aria-label="Click your face to earn coins">
        <img src="assets/vip.jpeg" alt="Birthday VIP" />
      </button>
      } @else {
      <!-- NORMAL BUTTON -->
      <button type="button" class="mainClickButton" [@squish]="squishState()" (click)="onButtonClick($event)"
        aria-label="Click to earn coins">
        <span class="material-icons" aria-hidden="true">paid</span>
      </button>
      }

      @if (bonusOrbVisible()) {
        <button
          type="button"
          class="bonusOrb"
          [style.--ox.px]="bonusOrbOffset().x"
          [style.--oy.px]="bonusOrbOffset().y"
          (click)="onBonusOrbClick($event)"
          aria-label="Bonus! Click for a one-time double click"
        >
          <span class="material-icons" aria-hidden="true">bolt</span>
        </button>
      }
    </div>

    <div class="comboBadge numeric" [class.active]="isComboActive()">
      <span>x{{ comboMultiplierDisplay() }}</span>
      <div class="comboTrack">
        <div class="comboFill" [style.width.%]="comboProgress() * 100"></div>
      </div>
    </div>
  </div>
</div>
