<div class="gameLayout">
  <app-achievement-toast />

  @if (offlineGainDisplay(); as gain) {
  <div class="offlineBanner" role="status">
    <span>Welcome back. You earned {{ gain }} coins while away.</span>
    <button type="button" class="offlineBannerDismiss" (click)="dismissOfflineBanner()" aria-label="Dismiss">
      <span class="material-icons" aria-hidden="true">close</span>
    </button>
  </div>
  }

  <header class="gameHeader">
    <h1 class="gameTitle">Coin Forge<span class="dot">.</span></h1>

    <div class="accountBar">
      <span class="accountEmail">{{ authService.currentUser()?.email }}</span>
      <button type="button" class="logoutButton" (click)="onLogOut()">
        <span class="material-icons" aria-hidden="true">logout</span>
        Log out
      </button>
    </div>
  </header>
  <!-- Left side -->
  <main class="gameMain">
    <div class="primaryColumn">
      <app-clicker class="clickerSlot" />
      <app-achievements />
      
    </div>
    <!-- Right side -->
    <div class="sidePanels">
      <app-upgrade-list />
      <app-rebirth-panel />
      <app-prestige />
      <app-reincarnation />
      <app-ascension />
      <app-abdication />
      <app-task />
    </div>
  </main>

  <footer class="gameFooter">
    <a routerLink="/privacy" class="footerPrivacyLink">Privacy Policy</a>
  </footer>
</div>
